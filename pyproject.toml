[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonplusplusplus"
version = "0.1.0"
description = "Python+ — Python with mandatory semicolons"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
  { name = "Said", email = "didisaid48@gmail.com" }
]
keywords = ["python", "language", "interpreter", "semicolon"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Saiddidi/pythonplusplus"
Issues   = "https://github.com/Saiddidi/pythonplusplus/issues"

[project.scripts]
pythonplusplus = "pythonplus.interpreter:main"
pyp            = "pythonplus.interpreter:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["pythonplus*"]
