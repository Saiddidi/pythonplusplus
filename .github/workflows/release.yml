name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    
    # تحديد البيئة لربطها بـ PyPI (تأكد من كتابة pypi في موقع PyPI أيضاً)
    environment:
      name: pypi
      url: https://pypi.org/p/said-pythonplusplus  # يمكنك استبدال الجزء الأخير باسم حزمتك الجديد

    permissions:
      # هذه الصلاحية ضرورية جداً لاستخدام ميزة Trusted Publishers وتوليد الـ OpenID Connect (OIDC) token
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build

    - name: Build package
      run: |
        python -m build

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
